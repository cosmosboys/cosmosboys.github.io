<style>
/* layout: night-sky official site. sticky wordmark bar, one route visible at a time, wide expanded English display over small Japanese labels, jackets carry the colour */
:root{
  --bg:#06090D; --bg2:#0D141B; --fg:#E8EEF0; --mute:#8D9AA3; --line:rgba(232,238,240,.14);
  --teal:#43C7CA; --coral:#FF7A5C; --card:#0F1820;
  --night:1; --glow-t:0 0 22px rgba(67,199,202,.55),0 0 2px rgba(232,238,240,.7); --glow-c:0 0 18px rgba(255,122,92,.6); --glow-img:0 0 0 1px rgba(67,199,202,.25),0 0 48px -6px rgba(67,199,202,.45),0 30px 60px -30px rgba(0,0,0,.8); --hero-bg:transparent;
  --disp:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EEF2F2; --bg2:#E2EAEA; --fg:#0B1116; --mute:#55636B; --line:rgba(11,17,22,.14);
  --teal:#07767B; --coral:#C6432A; --card:#FFFFFF; --night:0; --glow-t:none; --glow-c:none; --glow-img:0 18px 40px -18px rgba(0,0,0,.35); --hero-bg:var(--bg); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EEF2F2; --bg2:#E2EAEA; --fg:#0B1116; --mute:#55636B; --line:rgba(11,17,22,.14);
  --teal:#07767B; --coral:#C6432A; --card:#FFFFFF; --night:0; --glow-t:none; --glow-c:none; --glow-img:0 18px 40px -18px rgba(0,0,0,.35); --hero-bg:var(--bg); color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.8;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark{width:26px;height:31px;background:var(--fg);-webkit-mask:url(img/logo.png) center/contain no-repeat;mask:url(img/logo.png) center/contain no-repeat}
.brand b{font-family:var(--disp);font-stretch:125%;font-weight:800;font-size:15px;letter-spacing:.08em}
.nav{display:none;gap:26px}
.nav a{font-family:var(--disp);font-stretch:110%;font-weight:700;font-size:12px;letter-spacing:.2em;text-decoration:none;color:var(--mute);padding:6px 0}
.nav a[aria-current="page"]{color:var(--fg);box-shadow:inset 0 -2px var(--coral)}
.menu-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 0;cursor:pointer;font-family:var(--disp);font-stretch:110%;font-weight:700;font-size:12px;letter-spacing:.2em}
.menu-btn i{display:grid;gap:5px;width:22px}
.menu-btn i::before,.menu-btn i::after{content:"";height:1.5px;background:currentColor;display:block}
@media (min-width:860px){.nav{display:flex}.menu-btn{display:none}}

/* full-screen menu */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;height:60px}
.close{background:none;border:0;cursor:pointer;font-family:var(--disp);font-stretch:110%;font-weight:700;font-size:12px;letter-spacing:.2em;padding:10px 0}
.sheet nav{display:grid;margin-top:18px;border-top:1px solid var(--line)}
.sheet nav a{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none}
.sheet nav a b{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:clamp(30px,9vw,48px);line-height:1;letter-spacing:.01em}
.sheet nav a span{font-size:12px;color:var(--mute);letter-spacing:.12em;font-weight:700}
.sheet nav a[aria-current="page"] b{color:var(--coral)}
.sheet .sub{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:28px;font-size:13px}
.sheet .sub a{color:var(--mute);text-decoration:none;padding:6px 0}

/* section scaffolding */
main{min-height:70vh}
.view{padding-block:0 72px}
.sec{display:grid;gap:22px;padding-top:64px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--fg);padding-bottom:12px}
.sh h2{display:grid;gap:4px}
.en{text-shadow:var(--glow-t);font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:clamp(26px,7.2vw,44px);line-height:.95;letter-spacing:.005em}
.jp{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--mute)}
.more{font-family:var(--disp);font-stretch:110%;font-weight:700;font-size:11px;letter-spacing:.2em;text-decoration:none;color:var(--fg);white-space:nowrap;padding:6px 0;border-bottom:1px solid var(--fg)}
.pagehead{padding-top:44px;display:grid;gap:10px}
.pagehead .en{font-size:clamp(40px,11vw,76px)}
.lede{color:var(--mute);font-size:14px;max-width:38em}
.btn{max-width:100%;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 18px;border:1px solid var(--fg);text-decoration:none;font-family:var(--disp);font-stretch:110%;font-weight:700;font-size:12px;letter-spacing:.18em;background:none;cursor:pointer}
.btn.solid{background:var(--fg);color:var(--bg)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.tag{display:inline-block;font-family:var(--disp);font-stretch:100%;font-weight:700;font-size:11px;letter-spacing:.16em;border:1px solid currentColor;padding:1px 7px;line-height:1.6}
.tag.rel{color:var(--teal)} .tag.chart{color:var(--coral)} .tag.info{color:var(--mute)} .tag.soon{color:var(--coral)}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--hero-bg)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;display:grid;gap:30px;padding-block:40px 36px}
.hero .loc{font-family:var(--disp);font-stretch:100%;font-weight:600;font-size:11px;letter-spacing:.3em;color:var(--mute)}
.hero h1{text-shadow:var(--glow-t);font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:clamp(50px,14.5vw,124px);line-height:.84;letter-spacing:-.005em}
.hero h1 span{display:block}
.hero .tl{font-family:var(--disp);font-stretch:110%;font-weight:700;font-size:12px;letter-spacing:.24em;margin-top:16px}
.hero .tl em{font-style:normal;color:var(--coral);text-shadow:var(--glow-c)}
.next{display:grid;grid-template-columns:minmax(0,148px) 1fr;gap:18px;align-items:center;text-decoration:none;padding-top:22px;border-top:1px solid var(--line)}
.next img{width:100%;aspect-ratio:1;object-fit:cover;box-shadow:var(--glow-img)}
.next .k{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.24em;color:var(--teal)}
.next .t{font-family:var(--disp);font-stretch:105%;font-weight:800;font-size:clamp(20px,5.4vw,32px);line-height:1.08;margin-top:6px;text-wrap:balance}
.next .d{display:flex;align-items:baseline;gap:14px;margin-top:10px;flex-wrap:wrap}
.next .d b{font-family:var(--disp);font-stretch:85%;font-weight:700;font-size:15px;letter-spacing:.06em}
.next .d span{font-size:12.5px;color:var(--mute)}
.count{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-family:var(--disp);font-stretch:75%}
.count b{text-shadow:var(--glow-t);font-weight:800;font-size:40px;line-height:1;color:var(--fg)}
.count span{font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--mute)}
.next{max-width:760px}
@media (min-width:860px){.next{grid-template-columns:200px 1fr;gap:28px}}

/* lists */
.nl li{border-bottom:1px solid var(--line)}
.nl a{display:grid;grid-template-columns:84px 1fr 12px;gap:4px 14px;align-items:start;padding:16px 0;text-decoration:none}
.nl .d{font-family:var(--disp);font-stretch:80%;font-weight:700;font-size:14px;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1.5}
.nl .d small{display:block;font-size:11px;color:var(--mute);letter-spacing:.14em}
.nl .t{display:block;font-weight:700;font-size:15px;line-height:1.55;margin-top:4px}
.nl .n{display:block;font-size:12.5px;color:var(--mute);line-height:1.6}
.nl .go{align-self:center;width:8px;height:8px;border-top:1.5px solid var(--mute);border-right:1.5px solid var(--mute);transform:rotate(45deg)}

/* release grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rc{display:grid;gap:10px;text-decoration:none}
.rc .im{position:relative;aspect-ratio:1;overflow:hidden;background:var(--bg2)}
.rc img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.rc:hover img{transform:scale(1.03)}
.rc .meta{display:grid;gap:3px}
.rc .t{font-weight:700;font-size:14px;line-height:1.4}
.rc .s{font-family:var(--disp);font-stretch:85%;font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--mute)}
.rc .badge{position:absolute;left:8px;top:8px;background:var(--bg);color:var(--coral);font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.16em;padding:2px 8px}

.latest{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:18px;align-items:start}
.latest img{width:100%;aspect-ratio:1;object-fit:cover}
.latest .lt{font-family:var(--disp);font-stretch:105%;font-weight:800;font-size:clamp(20px,5.6vw,30px);line-height:1.1;margin-top:8px;text-wrap:balance}
.latest .btns{grid-column:1/-1}
@media (min-width:860px){.latest{grid-template-columns:300px 1fr;grid-template-rows:auto 1fr;column-gap:36px;row-gap:22px}.latest>a{grid-row:1/3}.latest .btns{grid-column:2;align-self:start}}
/* ranking */
.rank li{border-bottom:1px solid var(--line)}
.rank a{display:grid;grid-template-columns:40px 56px 1fr 12px;gap:14px;align-items:center;padding:12px 0;text-decoration:none}
.rank .rn{font-family:var(--disp);font-stretch:80%;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.rank li:first-child .rn{color:var(--coral)}
.rank img{width:56px;height:56px;object-fit:cover}
.rank .t{font-weight:700;font-size:15px;line-height:1.4;min-width:0}
.rank .go{width:8px;height:8px;border-top:1.5px solid var(--mute);border-right:1.5px solid var(--mute);transform:rotate(45deg)}
/* release page */
.rel-hero{display:grid;gap:26px;padding-top:28px}
.crumb{font-size:12px;color:var(--mute);display:flex;gap:8px;align-items:center}
.crumb a{text-decoration:none;color:var(--mute)}
.rel-hero .cv{width:min(100%,520px);aspect-ratio:1;object-fit:cover;box-shadow:var(--glow-img)}
.rel-hero h1{font-family:var(--disp);font-stretch:110%;font-weight:900;font-size:clamp(28px,8vw,52px);line-height:1;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.facts div{padding:12px 0;border-bottom:1px solid var(--line)}
.facts dt{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.22em;color:var(--mute)}
.facts dd{margin:2px 0 0;font-weight:700;font-size:14px;line-height:1.5}
.facts dd.ph{color:var(--teal)}
@media (min-width:860px){.rel-hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:48px}}
.story{display:grid;gap:14px;max-width:40em}
.story h3{font-family:var(--mincho);font-weight:800;font-size:clamp(22px,6vw,30px);line-height:1.45;text-wrap:balance}
.story p{font-size:15.5px;line-height:2}
.tracks li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
.tracks .no{font-family:var(--disp);font-stretch:75%;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.tracks .nm{font-weight:700;font-size:14.5px;line-height:1.45}
.tracks .ph{display:block;font-size:12px;color:var(--teal);font-weight:500}
.tracks button{background:none;border:0;padding:0;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tstory{grid-column:2/-1;display:grid;gap:8px;padding:6px 0 4px}
.tstory h4{margin:0;font-family:var(--mincho);font-weight:800;font-size:18px;line-height:1.5}
.tstory p{font-size:14.5px;line-height:1.95}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.pn a{display:grid;gap:4px;padding:14px;border:1px solid var(--line);text-decoration:none;min-width:0}
.pn a:last-child{text-align:right}
.pn small{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--mute)}
.pn span{font-weight:700;font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}

/* chapter1 */
.c1{display:grid;gap:12px}
.c1 details{border-bottom:1px solid var(--line)}
.c1 summary{list-style:none;display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:baseline;padding:14px 0;cursor:pointer}
.c1 summary::-webkit-details-marker{display:none}
.c1 summary b{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:16px;letter-spacing:.06em}
.c1 summary small{font-family:var(--disp);font-stretch:85%;font-weight:600;font-size:12px;color:var(--mute);letter-spacing:.06em}
.c1 summary i{font-style:normal;color:var(--mute);font-size:18px;line-height:1}
.c1 details[open] summary i{transform:rotate(45deg)}
.c1 ol{padding:0 0 16px 108px;display:grid;gap:4px;font-size:14px;counter-reset:c}
.c1 ol li{counter-increment:c}
.c1 ol li::before{content:counter(c)". ";color:var(--mute);font-family:var(--disp);font-stretch:80%}
.c1 .bc{margin:0 0 18px 108px}
@media (max-width:420px){.c1 summary{grid-template-columns:80px 1fr auto}.c1 ol,.c1 .bc{margin-left:0;padding-left:92px}.c1 .bc{padding-left:0;margin-left:92px}}

.c1all{display:grid;gap:14px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.c1n{display:flex;align-items:baseline;gap:10px}
.c1n b{font-family:var(--disp);font-stretch:85%;font-weight:800;font-size:44px;line-height:1;text-shadow:var(--glow-t)}
.c1n span{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--mute)}
.c1t{font-family:var(--disp);font-stretch:100%;font-weight:700;font-size:13px;letter-spacing:.12em;line-height:1.9;color:var(--mute)}
/* about */
.about-grid{display:grid;gap:40px}
@media (min-width:860px){.about-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:center;gap:56px}}
.prose{display:grid;gap:16px;max-width:40em}
.prose p{font-size:15.5px;line-height:2}
.prose .big{font-family:var(--mincho);font-weight:800;font-size:clamp(20px,5.6vw,28px);line-height:1.7}
/* three themes drawn as overlapping orbits; the band sits where all three meet */
.axis{display:grid;justify-items:center;gap:14px;padding-block:8px}
.axis svg{width:min(100%,420px);height:auto;overflow:visible}
.axis circle{fill-opacity:.16;stroke-width:1.2;mix-blend-mode:screen}
.axis .c1{fill:var(--teal);stroke:var(--teal)} .axis .c2{fill:var(--coral);stroke:var(--coral)} .axis .c3{fill:#8A6BE0;stroke:#8A6BE0}
.axis .w{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:17px;letter-spacing:.12em;fill:var(--fg);text-anchor:middle}
.axis .j{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.2em;fill:var(--mute);text-anchor:middle}
.axis .core{fill:var(--fg)}
.axis .eq{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.24em;color:var(--mute);text-align:center}
.axis .eq b{color:var(--coral);font-weight:700;margin:0 .5em}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .axis circle{mix-blend-mode:multiply;fill-opacity:.12}}
:root[data-theme="light"] .axis circle{mix-blend-mode:multiply;fill-opacity:.12}
.chap{display:grid;gap:0}
.chap article{display:grid;gap:8px;padding:20px 0;border-bottom:1px solid var(--line)}
.chap h3{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.chap h3 b{font-family:var(--disp);font-stretch:110%;font-weight:900;font-size:24px;letter-spacing:.04em}
.chap h3 small{font-family:var(--disp);font-stretch:85%;font-weight:600;font-size:12.5px;color:var(--mute);letter-spacing:.06em}
.chap p{font-size:14.5px;line-height:1.95;max-width:40em}

/* stories */
.stories{display:grid;gap:0}
.sto{display:grid;gap:12px;padding:24px 0;border-bottom:1px solid var(--line);max-width:40em}
.sto-h{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;font-size:14px}
.sto-h img{width:48px;height:48px;object-fit:cover}
.sto h3{font-family:var(--mincho);font-weight:800;font-size:clamp(20px,5.4vw,26px);line-height:1.5;text-wrap:balance}
.sto p{font-size:15px;line-height:2}
/* video */
.vg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}
@media (min-width:860px){.vg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vc{display:grid;gap:10px;text-decoration:none}
.vc .im{position:relative;aspect-ratio:1;overflow:hidden;background:var(--bg2)}
.vc img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(.82)}
.vc .play{position:absolute;inset:auto 10px 10px auto;width:40px;height:40px;border-radius:50%;background:var(--fg);display:grid;place-items:center}
.vc .play::after{content:"";margin-left:3px;border-left:12px solid var(--bg);border-top:7px solid transparent;border-bottom:7px solid transparent}
.vc .t{font-weight:700;font-size:14px;line-height:1.4}
.vc .s{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.18em;color:var(--mute)}


/* article */
.art{display:grid;gap:16px;padding-top:28px;max-width:720px}
.art .meta{display:flex;gap:12px;align-items:center;font-family:var(--disp);font-stretch:85%;font-weight:700;font-size:14px;letter-spacing:.04em}
.art h1{font-family:var(--mincho);font-weight:800;font-size:clamp(24px,6.6vw,36px);line-height:1.45;text-wrap:balance}
.art .sum{color:var(--mute);font-size:13.5px}
.art .cv{width:min(100%,360px);aspect-ratio:1;object-fit:cover;margin-top:6px}
.art .body{display:grid;gap:14px;border-top:1px solid var(--fg);padding-top:20px}
.art .body p{font-size:15.5px;line-height:2}

/* full-page night sky, dark mode only */
#night{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
main,.foot{position:relative;z-index:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #night{display:block}}
:root[data-theme="dark"] #night{display:block}
/* the purple three-eyed cat sits on the footer edge, looking up at the sky; tap and it turns around */
.catwrap{position:relative}
.cat{position:absolute;right:max(18px,env(safe-area-inset-right,0px));top:-48px;transform:translateY(-100%);width:24px;height:56px;padding:0;border:0;background:none;cursor:pointer}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;transition:opacity .25s,transform .25s}
.cat .cf{opacity:0;transform:scale(.96)}
.cat.turn .cb{opacity:0}.cat.turn .cf{opacity:1;transform:none}
.cat:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
@media (min-width:860px){.cat{width:28px;height:64px}}
/* ===== space reveal. hidden states apply only once the script has armed it (html.rv-on) =====
   letters ignite like stars in random order / a comet draws each heading rule /
   jackets come out from behind an eclipse / text arrives doppler-shifted and settles */
.rv-on .rv-ch{display:inline-block;opacity:0;transform:scale(.15);filter:blur(5px) brightness(3);transition:opacity .35s,transform .9s cubic-bezier(.16,1.3,.3,1),filter 1s;transition-delay:calc(var(--r)*70ms)}
.rv-on .in .rv-ch{opacity:1;transform:none;filter:none}
.rv-host{position:relative}
.rv-on .sh.rv{position:relative;border-bottom-color:transparent;background:linear-gradient(90deg,transparent,var(--fg) 30%) left bottom/0% 1px no-repeat;transition:background-size 1.2s cubic-bezier(.5,0,.2,1) .2s}
.rv-on .sh.rv.in{background-size:100% 1px}
.rv-on .sh.rv::after{content:"";position:absolute;left:0;bottom:-2px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--teal),0 0 18px 6px color-mix(in srgb,var(--teal) 60%,transparent);opacity:0}
.rv-on .sh.rv.in::after{animation:comet 1.2s cubic-bezier(.5,0,.2,1) .2s both}
@keyframes comet{0%{left:0;opacity:0}10%{opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
.rv-on .sh.rv .jp,.rv-on .sh.rv .more{opacity:0;letter-spacing:.6em;transition:opacity .8s .7s,letter-spacing 1s .7s cubic-bezier(.2,.8,.2,1)}
.rv-on .sh.rv.in .jp{opacity:1;letter-spacing:.14em}.rv-on .sh.rv.in .more{opacity:1;letter-spacing:.2em}
.rv-on .rv-img{clip-path:circle(0% at 50% 50%);filter:brightness(2.2) saturate(0);transition:clip-path 1.3s cubic-bezier(.65,0,.2,1),filter 1.6s .2s;transition-delay:calc(var(--i,0)*110ms)}
.rv-on .rv-img.in{clip-path:circle(75% at 50% 50%);filter:none}
.rv-on .rv-up{opacity:0;transform:translateY(18px);text-shadow:-14px 0 0 color-mix(in srgb,var(--teal) 70%,transparent),14px 0 0 color-mix(in srgb,var(--coral) 70%,transparent);transition:opacity .9s,transform 1s cubic-bezier(.2,.8,.2,1),text-shadow 1.2s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*90ms)}
.rv-on .rv-up.in{opacity:1;transform:none;text-shadow:0 0 0 transparent}
.rv-on .axis.rv circle{stroke-dasharray:660;stroke-dashoffset:660;fill-opacity:0;transform-origin:200px 185px;transform:rotate(-120deg);transition:stroke-dashoffset 1.8s cubic-bezier(.6,0,.2,1),fill-opacity 1s 1.3s,transform 2s cubic-bezier(.2,.8,.2,1)}
.rv-on .axis.rv circle.c2{transition-delay:.25s,1.5s,.25s}.rv-on .axis.rv circle.c3{transition-delay:.5s,1.7s,.5s}
.rv-on .axis.rv.in circle{stroke-dashoffset:0;fill-opacity:.16;transform:none}
.rv-on .axis.rv text,.rv-on .axis.rv .core{opacity:0;transition:opacity .8s 1.6s}
.rv-on .axis.rv.in text,.rv-on .axis.rv.in .core{opacity:1}
/* dark mode extras: each letter flares like a star igniting, jackets get a corona as the eclipse ends */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]).rv-on .in .rv-ch{animation:ignite 1.6s calc(var(--r)*70ms) both}
 :root:not([data-theme="light"]).rv-on .rv-img.in{animation:corona 2.2s calc(var(--i,0)*110ms + .5s) both}}
:root[data-theme="dark"].rv-on .in .rv-ch{animation:ignite 1.6s calc(var(--r)*70ms) both}
:root[data-theme="dark"].rv-on .rv-img.in{animation:corona 2.2s calc(var(--i,0)*110ms + .5s) both}
@keyframes ignite{0%{text-shadow:0 0 0 #fff}25%{text-shadow:0 0 4px #fff,0 0 22px #fff,0 0 44px var(--teal)}100%{text-shadow:var(--glow-t)}}
@keyframes corona{0%{box-shadow:0 0 0 0 rgba(255,255,255,0)}30%{box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 60px 10px color-mix(in srgb,var(--coral) 55%,transparent)}100%{box-shadow:var(--glow-img)}}
@media (prefers-reduced-motion:reduce){.rv-on .rv-ch,.rv-on .rv-img,.rv-on .rv-up,.rv-on .sh.rv,.rv-on .axis.rv circle{transition:none!important;animation:none!important;opacity:1!important;transform:none!important;filter:none!important;clip-path:none!important}}
/* footer */
.foot{border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 82%,transparent);padding-block:48px calc(36px + env(safe-area-inset-bottom,0px))}
.foot .cols{display:grid;gap:30px}
@media (min-width:860px){.foot .cols{grid-template-columns:repeat(3,minmax(0,1fr))}}
.foot h3{font-family:var(--disp);font-stretch:110%;font-weight:800;font-size:12px;letter-spacing:.24em;color:var(--mute);margin-bottom:10px}
.foot ul{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.foot a{text-decoration:none;font-size:14px;display:block;padding:7px 0}
.foot a small{display:block;font-size:11px;color:var(--mute);line-height:1.3}
.foot .end{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
.foot .end .mark{width:22px;height:26px;background:var(--mute)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* night sky with an occasional meteor; static stars when motion is reduced */
let skyRAF=0;
function sky(){
  cancelAnimationFrame(skyRAF);
  const c=$("sky"); if(!c) return; const x=c.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,stars=[],mets=[],last=0; const dpr=Math.min(2,devicePixelRatio||1);
  const col=()=>getComputedStyle(document.documentElement);
  function size(){const r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    stars=Array.from({length:Math.round(W*H/2600)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.1+.2,a:Math.random()*.6+.2,t:Math.random()*6}));}
  size(); addEventListener("resize",size,{once:true});
  function frame(t){
    if(!$("sky")) return;
    if(getComputedStyle(document.documentElement).getPropertyValue("--night").trim()==="1"){x.clearRect(0,0,W,H);skyRAF=requestAnimationFrame(frame);return;}
    const cs=col(), fg=cs.getPropertyValue("--fg").trim()||"#fff", coral=cs.getPropertyValue("--coral").trim(), teal=cs.getPropertyValue("--teal").trim(), night=cs.getPropertyValue("--night").trim()==="1";
    x.clearRect(0,0,W,H);
    for(const s of stars){x.globalAlpha=s.a*(reduce?1:.75+.25*Math.sin(t/900+s.t));x.fillStyle=fg;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();}
    if(!reduce){
      if(!night){mets=[];}
      else if(t-last>700+Math.random()*1500){last=t;const big=Math.random()<.25;mets.push({x:W*(.25+Math.random()*.8),y:Math.random()*H*.45,t0:t,dur:big?1500:900+Math.random()*400,len:big?240:110+Math.random()*80,c:Math.random()<.5?teal:coral,w:big?2.4:1.4});if(mets.length>8)mets.shift();}
      mets=mets.filter(m=>t-m.t0<m.dur);
      for(const m of mets){const k=(t-m.t0)/m.dur, len=m.len, hx=m.x-k*m.len*1.9, hy=m.y+k*m.len*1.25;
        const g=x.createLinearGradient(hx,hy,hx+len*.84,hy-len*.55);g.addColorStop(0,m.c);g.addColorStop(1,"transparent");
        x.globalAlpha=Math.sin(k*Math.PI);x.shadowColor=m.c;x.shadowBlur=14;x.strokeStyle=g;x.lineWidth=m.w;x.beginPath();x.moveTo(hx,hy);x.lineTo(hx+len*.84,hy-len*.55);x.stroke();
        x.fillStyle="#fff";x.beginPath();x.arc(hx,hy,m.w*.9,0,7);x.fill();x.shadowBlur=0;}
      skyRAF=requestAnimationFrame(frame);
    }
    x.globalAlpha=1;
  }
  skyRAF=requestAnimationFrame(frame);
}

/* ===== night sky: nebula, three star layers with scroll parallax, meteor shower, tap to shoot ===== */
(function(){
  const c=$("night"), x=c.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isNight=()=>getComputedStyle(document.documentElement).getPropertyValue("--night").trim()==="1";
  let W=0,H=0,dpr=1,layers=[],mets=[],last=0,burstAt=0,raf=0,warpAt=0;
  const TEAL=[67,199,202], CORAL=[255,122,92], WHITE=[232,238,240];
  const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  function size(){
    dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
    c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
    const area=W*H;
    layers=[[.06,area/2200,.6],[.18,area/7000,1.1],[.38,area/26000,1.8]].map(([sp,n,r])=>({sp,stars:Array.from({length:Math.round(n)},()=>({x:Math.random()*W,y:Math.random()*H*2,r:Math.random()*r+.25,a:Math.random()*.6+.25,t:Math.random()*6,tint:Math.random()<.12?TEAL:Math.random()<.08?CORAL:WHITE}))}));
  }
  const neb=[{c:TEAL,x:.85,y:.08,r:.75,sx:.00005,sy:.00007,p:0},{c:CORAL,x:.05,y:.92,r:.7,sx:.00006,sy:.00004,p:2},{c:[120,90,220],x:.55,y:.5,r:.55,sx:.00004,sy:.00005,p:4}];
  function shoot(px,py,big){
    const ang=Math.PI*(.74+Math.random()*.06), base=Math.max(W,500)/1000, sp=base*(big?.55:.4+Math.random()*.25);
    mets.push({x:px,y:py,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,t0:performance.now(),dur:big?1700:900+Math.random()*500,len:(big?.75:.32+Math.random()*.2)*Math.min(W,700),w:big?2.6:1.3+Math.random()*.6,c:Math.random()<.5?TEAL:CORAL});
    if(mets.length>14) mets.shift();
  }
  function frame(t){
    raf=0;
    if(!isNight()){x.clearRect(0,0,W,H);return;}
    const sy=scrollY;
    x.clearRect(0,0,W,H);
    // nebula drifting slowly
    x.globalCompositeOperation="lighter";
    for(const n of neb){
      const k=reduce?0:t;
      const cx=(n.x+Math.sin(k*n.sx+n.p)*.08)*W, cy=(n.y+Math.cos(k*n.sy+n.p)*.06)*H-sy*.04;
      const R=n.r*Math.max(W,H), g=x.createRadialGradient(cx,cy,0,cx,cy,R);
      const pulse=reduce?1:.85+.15*Math.sin(k*.0004+n.p);
      g.addColorStop(0,rgba(n.c,.20*pulse)); g.addColorStop(.45,rgba(n.c,.07*pulse)); g.addColorStop(1,rgba(n.c,0));
      x.fillStyle=g; x.fillRect(0,0,W,H);
    }
    // stars, deeper layers move slower on scroll; during a warp they stretch toward the edges
    const wk=warpAt?Math.max(0,1-(performance.now()-warpAt)/900):0, wv=wk>0?Math.sin(wk*Math.PI):0;
    for(const L of layers){
      const off=(sy*L.sp)%(H*2);
      for(const s of L.stars){
        let y=s.y-off; if(y<-4) y+=H*2; if(y>H+4) continue;
        const tw=reduce?1:.55+.45*Math.sin(t/700+s.t);
        x.globalAlpha=s.a*tw; x.fillStyle=rgba(s.tint,1);
        if(wv>.02){ const dx=s.x-W/2, dy=y-H/2, k=wv*(.25+L.sp*2.2); x.globalAlpha=Math.min(1,s.a*1.6); x.strokeStyle=rgba(s.tint,1); x.lineWidth=s.r*1.3; x.beginPath(); x.moveTo(s.x,y); x.lineTo(s.x+dx*k,y+dy*k); x.stroke(); continue; }
        x.beginPath(); x.arc(s.x,y,s.r,0,7); x.fill();
        if(s.r>1.6&&tw>.9){ // cross glint on the brightest
          x.globalAlpha=(tw-.9)*6*s.a; x.strokeStyle=rgba(s.tint,1); x.lineWidth=.6;
          x.beginPath(); x.moveTo(s.x-s.r*5,y); x.lineTo(s.x+s.r*5,y); x.moveTo(s.x,y-s.r*5); x.lineTo(s.x,y+s.r*5); x.stroke();
        }
      }
    }
    x.globalAlpha=1;
    if(!reduce){
      // opening burst, then a steady shower
      if(burstAt&&t-burstAt<1600&&Math.random()<.18) shoot(W*(.3+Math.random()*.75),H*Math.random()*.4,Math.random()<.2);
      if(t-last>600+Math.random()*1400){last=t; shoot(W*(.25+Math.random()*.8),H*Math.random()*.5,Math.random()<.12);}
      const now=performance.now();
      mets=mets.filter(m=>now-m.t0<m.dur);
      for(const m of mets){
        const k=(now-m.t0)/m.dur, d=k*m.dur, hx=m.x+m.vx*d, hy=m.y+m.vy*d;
        const nx=-m.vx, ny=-m.vy, nl=Math.hypot(nx,ny)||1, tx=hx+nx/nl*m.len, ty=hy+ny/nl*m.len;
        const g=x.createLinearGradient(hx,hy,tx,ty); g.addColorStop(0,rgba(m.c,1)); g.addColorStop(.3,rgba(m.c,.45)); g.addColorStop(1,rgba(m.c,0));
        const a=Math.sin(Math.min(1,k)*Math.PI);
        x.globalAlpha=a; x.shadowColor=rgba(m.c,1); x.shadowBlur=18; x.strokeStyle=g; x.lineWidth=m.w; x.lineCap="round";
        x.beginPath(); x.moveTo(hx,hy); x.lineTo(tx,ty); x.stroke();
        x.shadowBlur=24; x.fillStyle="#fff"; x.beginPath(); x.arc(hx,hy,m.w*1.1,0,7); x.fill();
        if(m.w>2){ // big ones shed sparks
          for(let i=0;i<3;i++){const q=Math.random()*.35; x.globalAlpha=a*(1-q*2); x.fillStyle=rgba(m.c,1); x.beginPath(); x.arc(hx+(tx-hx)*q+(Math.random()-.5)*6,hy+(ty-hy)*q+(Math.random()-.5)*6,.9,0,7); x.fill();}
        }
        x.shadowBlur=0;
      }
      x.globalAlpha=1;
    }
    x.globalCompositeOperation="source-over";
    if(!reduce) raf=requestAnimationFrame(frame);
  }
  const start=()=>{ if(!raf) raf=requestAnimationFrame(frame); };
  size(); burstAt=performance.now(); start();
  addEventListener("resize",()=>{size(); if(reduce) start();});
  if(reduce) addEventListener("scroll",start,{passive:true});
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{burstAt=performance.now(); start();});
  new MutationObserver(()=>{burstAt=performance.now(); start();}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  document.addEventListener("pointerdown",e=>{ if(!isNight()||reduce||e.target.closest("a,button,summary,input")) return; shoot(e.clientX+60,e.clientY-40,true); start(); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) start(); });
  addEventListener("hashchange",()=>{ if(!reduce&&isNight()){ warpAt=performance.now(); start(); } });
})();
/* ===== scroll reveal wiring ===== */
const RV=(function(){
  if(!("IntersectionObserver" in window)||matchMedia("(prefers-reduced-motion: reduce)").matches) return ()=>{};
  document.documentElement.classList.add("rv-on");
  const proxy=new Map();
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ const t=proxy.get(e.target)||[e.target]; t.forEach(x=>{ x.classList.add("in"); if(x.dataset.count) countUp(x); }); io.unobserve(e.target); proxy.delete(e.target); } }),{rootMargin:"0px 0px -8% 0px",threshold:.05});
  const watchImg=el=>{ el.classList.add("rv-img"); const p=el.parentElement; if(!proxy.has(p)) proxy.set(p,[]); proxy.get(p).push(el); io.observe(p); };
  const split=el=>{ if(el.dataset.split) return; el.dataset.split=1; let i=0;
    const walk=n=>{ [...n.childNodes].forEach(c=>{ if(c.nodeType===3){ const f=document.createDocumentFragment(); [...c.textContent].forEach(ch=>{ const s=document.createElement("span"); s.className="rv-ch"; s.style.setProperty("--i",i++); s.style.setProperty("--r",Math.floor(Math.random()*8)); s.textContent=ch===" "?" ":ch; f.appendChild(s); }); c.replaceWith(f); } else if(c.nodeType===1) walk(c); }); };
    walk(el); };
  function countUp(el){ const to=+el.dataset.count, t0=performance.now(); const tick=t=>{ const k=Math.min(1,(t-t0)/1100); el.textContent=Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(tick); }; el.textContent="0"; requestAnimationFrame(tick); }
  return function(root){
    root.querySelectorAll(".en, .hero h1 span, .pagehead .en").forEach(el=>{ split(el); el.classList.add("rv-host"); io.observe(el); });
    root.querySelectorAll(".sh").forEach(el=>{ el.classList.add("rv"); io.observe(el); });
    root.querySelectorAll(".grid, .vg, .start").forEach(g=>[...g.children].forEach((c,i)=>{ const im=c.querySelector(".im")||c; im.style.setProperty("--i",i%4); watchImg(im); }));
    root.querySelectorAll(".next img, .latest img, .rel-hero .cv, .art .cv, .rank img, .sto-h img").forEach(watchImg);
    root.querySelectorAll(".nl li, .rank li, .tracks li, .stories .sto, .chap article, .prose p, .lede, .c1all, .facts, .btns, .theme3").forEach((el,i)=>{ el.classList.add("rv-up"); el.style.setProperty("--i",(i%5)); io.observe(el); });
    root.querySelectorAll(".axis").forEach(el=>{ el.classList.add("rv"); io.observe(el); });
    root.querySelectorAll(".count b").forEach(el=>{ if(/^\d+$/.test(el.textContent)){ el.dataset.count=el.textContent; io.observe(el); } });
  };
})();
